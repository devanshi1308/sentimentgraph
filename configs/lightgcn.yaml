# LightGCN baseline (RecBole-GNN) — one YAML per run; holds seed + metrics
model: LightGCN
dataset: video_games
data_path: data/processed/

seed: 2020
reproducibility: true

# Official 5-core benchmark split (see popularity.yaml for the mechanism).
benchmark_filename: [train, valid, test]
eval_args:
  mode: full
  split: {'RS': [0.8, 0.1, 0.1]}
  order: TO
  group_by: user

embedding_size: 64
n_layers: 3
reg_weight: 1e-4
train_batch_size: 2048
learning_rate: 0.001
epochs: 300

metrics: [Recall, NDCG]
topk: [10, 20]
valid_metric: NDCG@10

# Device: RecBole uses CUDA when torch.cuda.is_available(), else CPU.
use_gpu: true
gpu_id: 0
