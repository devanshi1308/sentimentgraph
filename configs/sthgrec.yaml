# ST-HGRec — LightGCN-heterogeneous over our graph (sentiment + trust edges)
# One YAML per run; holds seed + metrics.
model: STHGRec
dataset: video_games
data_path: data/processed/

seed: 2020
reproducibility: true

# Official 5-core benchmark split (see popularity.yaml for the mechanism).
benchmark_filename: [train, valid, test]
eval_args:
  mode: full
  split: {'RS': [0.8, 0.1, 0.1]}
  order: TO
  group_by: user

embedding_size: 64
n_layers: 3
reg_weight: 1e-4
train_batch_size: 2048
learning_rate: 0.001
epochs: 300

# heterogeneous edges
use_sentiment_edges: true
use_trust_edges: true

# Relation-strength scalars (STHGREC_DESIGN.md §2.2). Default 1.0 = each relation
# contributes at its normalized magnitude. Fixed (not learned); lets the lead
# tune relative strength without retraining code.
sentiment_weight: 1.0
aspect_weight: 1.0
trust_weight: 1.0

# LightGCN parity knob consumed by the L2 reg (RecBole EmbLoss). LightGCN's
# default is false; kept explicit for reproducibility.
require_pow: false

# Source CSVs for graph-tensor construction (STHGREC_DESIGN.md §1.2). The model
# builds adjacency from these, NOT from graph.gpickle. Paths are repo-relative.
graph_inter_csv: data/processed/video_games/video_games.train.inter
graph_sentiment_csv: data/interim/absa_normalized.csv
graph_trust_csv: data/interim/trust_signals.csv
# Deterministic raw<->index contract (STHGREC_DESIGN.md §1.1); tracked in git.
graph_id_map_json: data/processed/video_games/sthgrec_id_maps.json

metrics: [Recall, NDCG]
topk: [10, 20]
valid_metric: NDCG@10

# --- device -----------------------------------------------------------------
# CUDA is fully supported: torch.sparse.mm has cuSPARSE spmm kernels, and the
# three adjacencies are frozen buffers (requires_grad=False), so the only
# backward path is a second structured spmm -> deterministic under seed 2020.
# Verify once on your GPU with:  python -m src.eval.run_sthgrec --check-determinism
#
# Apple MPS is NOT supported (no sparse-tensor kernels). On a Mac, run_sthgrec.py
# detects this and forces device: cpu automatically, so leaving use_gpu: true
# here is safe everywhere.
use_gpu: true
gpu_id: 0
